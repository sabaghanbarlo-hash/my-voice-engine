name: Speak

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script file, e.g. scripts/my-text.txt"
        default: "scripts/sample.txt"
      speed:
        description: "Speaking speed: 0.9 slower, 1.0 normal, 1.1 faster"
        default: "1.0"
      language:
        description: "Language code of the script (en = English)"
        default: "en"
      steps:
        description: "Quality steps (16 is good, 24 is slower and a bit cleaner)"
        default: "16"

permissions:
  contents: write

concurrency:
  group: speak
  cancel-in-progress: false

jobs:
  speak:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SCRIPT: ${{ github.event.inputs.script }}
      SPEED: ${{ github.event.inputs.speed }}
      LANGUAGE: ${{ github.event.inputs.language }}
      STEPS: ${{ github.event.inputs.steps }}
    steps:
      - uses: actions/checkout@v4

      - name: Check inputs
        run: |
          [[ "$SCRIPT" =~ ^scripts/[A-Za-z0-9._-]+\.txt$ ]] || { echo "::error::script must look like scripts/name.txt"; exit 1; }
          test -f "$SCRIPT" || { echo "::error::$SCRIPT not found"; exit 1; }
          [[ "$SPEED" =~ ^[0-2](\.[0-9]+)?$ ]] || SPEED=1.0
          [[ "$STEPS" =~ ^[0-9]{1,2}$ ]] || STEPS=16
          [[ "$LANGUAGE" =~ ^[a-z]{2,3}$ ]] || LANGUAGE=en
          echo "SPEED=$SPEED" >> "$GITHUB_ENV"
          echo "STEPS=$STEPS" >> "$GITHUB_ENV"
          echo "LANGUAGE=$LANGUAGE" >> "$GITHUB_ENV"
          ls voice/ref.* >/dev/null 2>&1 || { echo "::error::No voice sample. Put 10-30 s of your clean voice at voice/ref.m4a (or .wav/.mp3)."; exit 1; }

      - name: System dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources /etc/apt/sources.list.d/mono-official-stable.list
          for i in 1 2 3; do
            sudo apt-get update -y -o Acquire::Retries=3 || true
            sudo apt-get install -y ffmpeg espeak-ng && break
            echo "apt attempt $i failed, retrying..."; sleep 10
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Voice Studio
        run: |
          pip install numpy
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=5.10.0" accelerate pydub soundfile numpy
          pip install --no-deps "git+https://github.com/debpalash/VoiceStudio.git"
          python -c "import omnivoice; from omnivoice import OmniVoice; print('Voice Studio engine ok')"

      - name: Cache Voice Studio model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-voicestudio-v1

      - name: Cache finished sentences
        uses: actions/cache@v4
        with:
          path: .work
          key: vs-sentences-${{ github.run_id }}
          restore-keys: vs-sentences-

      - name: Speak
        run: |
          mkdir -p output
          name=$(basename "${SCRIPT%.txt}")
          src=$(ls voice/ref.* | grep -v '\.txt$' | head -1)
          ffmpeg -y -v error -i "$src" -t 20 -ar 24000 -ac 1 "$RUNNER_TEMP/ref.wav"
          [ -f voice/ref.txt ] && cp voice/ref.txt "$RUNNER_TEMP/ref.txt" || true
          python -u tts.py "$SCRIPT" --ref "$RUNNER_TEMP/ref.wav" --speed "$SPEED" --steps "$STEPS" --language "$LANGUAGE" --out "output/$name.mp3"
          ls -la output

      - uses: actions/upload-artifact@v4
        with:
          name: voice
          path: output/*.mp3

      - name: Save the audio so the website can play it
        run: |
          name=$(basename "${SCRIPT%.txt}")
          mkdir -p results
          cp "output/$name.mp3" "results/$name.mp3"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add results
          git commit -m "Audio ready: $name [skip ci]" || echo "nothing to commit"
          git pull --rebase || true
          git push || true
